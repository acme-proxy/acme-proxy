# One database, plain and TLS listeners (`ldap:///` with StartTLS, and
# `ldaps:///`), and the schemas inetOrgPerson and groupOfNames need.
include   /etc/ldap/schema/core.schema
include   /etc/ldap/schema/cosine.schema
include   /etc/ldap/schema/inetorgperson.schema

pidfile   /run/lab-slapd/slapd.pid
argsfile  /run/lab-slapd/slapd.args

modulepath /usr/lib/ldap
moduleload back_mdb.so

TLSCACertificateFile  /certs/ca.pem
TLSCertificateFile    /certs/server.pem
TLSCertificateKeyFile /certs/server.key

database  mdb
maxsize   67108864
suffix    "dc=example,dc=com"
rootdn    "cn=admin,dc=example,dc=com"
rootpw    admin-password
directory /var/lib/lab-ldap
index     objectClass eq
index     uid,member eq

# A person may bind with their own password and nobody may read one; the
# service account (the rootdn) reads everything else.
access to attrs=userPassword
    by anonymous auth
    by * none
access to *
    by * read
