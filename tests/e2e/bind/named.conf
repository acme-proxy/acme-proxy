options {
    directory "/var/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion no;
    pid-file "/tmp/named.pid";
};

key "tsig-key." {
    algorithm hmac-sha256;
    secret "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef";
};

zone "lab" {
    type master;
    file "/var/bind/lab/lab.zone";
    allow-update { key "tsig-key."; };
};

zone "0.60.10.in-addr.arpa" {
    type master;
    file "/var/bind/lab/reverse.zone";
    allow-update { key "tsig-key."; };
};
