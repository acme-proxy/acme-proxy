[package]
name = "acme-proxy-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Every target here drives `acme-proxy`'s own parsers, so this list stays short
# on purpose: a fuzz target whose body only calls a third-party crate fuzzes
# that crate, not this one, and the two original targets did exactly that.
[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
base64 = "0.23.0"
acme-proxy = { path = ".." }

[workspace]
members = ["."]

# Pre-authentication surfaces, in the order a request reaches them.

# The flattened JWS envelope, its base64url members, and the hand-rolled
# JWK -> DER SPKI encoding an embedded `jwk` goes through.
[[bin]]
name = "jws_envelope"
path = "fuzz_targets/jws_envelope.rs"
test = false
doc = false

# The other direction: DER SPKI -> JWK, plus the thumbprint a key authorization
# is compared against. Driven by a corrupted `accounts.pubkey` row.
[[bin]]
name = "spki"
path = "fuzz_targets/spki.rs"
test = false
doc = false

# Certificate and chain parsing: the PEM a client posts to `revokeCert`, and
# the certID `GET /renewalInfo/{id}` takes as a raw, unauthenticated path
# segment.
[[bin]]
name = "certificate"
path = "fuzz_targets/certificate.rs"
test = false
doc = false

# Identifier shape and normalization — the gate that keeps a `dns` identifier
# one opaque name, and so the thing standing between a crafted value and a
# filter that misreads it.
[[bin]]
name = "identifier"
path = "fuzz_targets/identifier.rs"
test = false
doc = false
