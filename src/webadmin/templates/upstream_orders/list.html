{% extends "layout.html" %}
{% block content %}
  <h1>Upstream orders</h1>
  <p class="small">One row per local order the <code>relay</code> signer backend
    opened at its upstream CA. Read-only — to abandon an in-flight relay,
    cancel its <code>signer_relay_issue</code> job.</p>

  <div class="panel">
    <form class="row" hx-get="/ui/upstream-orders" hx-target="#upstream-orders-table"
          hx-push-url="true" hx-trigger="change, submit">
      <div class="field">
        <label for="profile">Profile</label>
        <select id="profile" name="profile">
          <option value="">every profile</option>
          {% for profile in profiles %}
            <option value="{{ profile.name }}"
                    {% if filters.profile == profile.name %}selected{% endif %}>
              {{ profile.name }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="status">Status</label>
        <select id="status" name="status">
          <option value="">any status</option>
          {% for status in statuses %}
            <option value="{{ status }}"
                    {% if filters.status == status %}selected{% endif %}>{{ status }}</option>
          {% endfor %}
        </select>
      </div>
    </form>
  </div>

  {% include "upstream_orders/_table.html" %}
{% endblock %}
