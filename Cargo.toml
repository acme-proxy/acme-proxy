# One binary over a layered workspace of lockstep crates; see
# doc/src/dev/adr/0002-workspace-layering.md.
[workspace]
members = ["crates/*"]
# Container fixtures for the e2e lab, built by their own `Containerfile`s and
# never by this workspace.
exclude = ["tests/e2e/netbox-mock", "tests/e2e/phpipam-mock"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
# CI's `msrv` job checks the workspace on exactly this toolchain.
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/acme-proxy/acme-proxy"
documentation = "https://acme-proxy.github.io/acme-proxy/"
homepage = "https://acme-proxy.github.io/acme-proxy/"

# Every dependency of every member, declared once. A member names the ones it
# uses with `<name>.workspace = true`, so versions and features cannot drift
# between crates.
[workspace.dependencies]
# The workspace's own crates, pinned exactly: they are released together.
acme-proxy-core = { path = "crates/core", version = "=0.5.0" }
acme-proxy-store = { path = "crates/store", version = "=0.5.0" }
acme-proxy-net = { path = "crates/net", version = "=0.5.0" }
acme-proxy-policy = { path = "crates/policy", version = "=0.5.0" }
acme-proxy-jobs = { path = "crates/jobs", version = "=0.5.0" }
acme-proxy-signer = { path = "crates/signer", version = "=0.5.0" }
acme-proxy-protocol = { path = "crates/protocol", version = "=0.5.0" }
acme-proxy-admin = { path = "crates/admin", version = "=0.5.0" }
acme-proxy-server = { path = "crates/server", version = "=0.5.0" }

axum = "0.8"
# Multi-threaded runtime for the concurrent axum server, plus what's actually
# used: net/time/process/signal/sync (mpsc) and io-util (AsyncRead/WriteExt,
# for crates/net/src/tls.rs and crates/policy/src/filter/custom.rs's piped child stdin). No `fs` — CLI
# stdin reading goes through `std::io::stdin`, not `tokio::io`.
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "time", "process", "signal", "sync", "io-util"] } # Runtime async
serde = { version = "1.0", features = ["derive"] } # Serialization JSON
serde_json = "1.0"    # Parsing JSON
tower = { version = "0.5", features = ["limit"] } # Middleware
tower-http = { version = "0.7", features = ["set-header", "catch-panic"] } # Middleware HTTP
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "postgres", "tls-rustls-ring", "time", "uuid"] }
config = { version = "0.15", default-features = false, features = ["toml"] } # Configuration (TOML + env)
uuid = { version = "1.23.4", features = ["v7", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
base64 = "0.23.0"
ring = "0.17.14"
simple_asn1 = "0.6.4"
hex = "0.4"
# CSR parsing and leaf signing for the local CA, on `ring` (ADR 0009).
rcgen = { version = "0.14.8", default-features = false, features = ["ring", "pem", "x509-parser"] }
# `CertificateSigningRequestDer` wrapper that `rcgen`'s CSR parser takes (rcgen
# re-exports the parser but not this pki-types type). Unifies with rcgen's copy.
rustls-pki-types = "1"
time = { version = "0.3", features = ["formatting", "parsing"] } # RFC3339 <-> epoch for order objects
anyhow = "1"
# Every error type derives it; `anyhow` is used without `.context()`
# (doc/src/dev/adr/0010-error-types.md).
thiserror = "2"
# Required by the `Filter` (`crates/policy/src/filter`) and `SignerBackend` (`crates/signer/src`)
# traits: `Arc<dyn Trait>` with `async fn` methods is not dyn-safe without it.
async-trait = "0.1"
ipnet = "2.12"  # CIDR parsing + containment for the IP allowlist / trusted proxies
regex = "1.13"  # identifier and reverse-DNS hostname allow/deny lists
# `/metrics`: histograms and the OpenMetrics text format, with no global
# registry (doc/src/dev/adr/0011-metrics-on-prometheus-client.md).
prometheus-client = { version = "0.25", default-features = false }
# PTR + forward-confirmation lookups for the reverse-DNS filter, and the TXT
# lookups of the `dns-01` challenge. Default features off: no DNSSEC/TLS
# transports needed, just the system resolver.
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
# RFC 2136 updates + TSIG for the relay's dns-01 strategy. Already in the tree
# via the resolver; `dnssec-ring` gates TSIG signing itself (ADR 0009).
hickory-proto = { version = "0.26", default-features = false, features = ["std", "dnssec-ring"] }
# Outbound HTTP (http-01, the relay, IPAM, webhooks). Already in the tree via `axum`, and
# the validator needs its own body cap and redirect policy (ADR 0009).
hyper = { version = "1.11", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }  # the TokioIo adapter
http-body-util = "0.1"  # Empty request body, Limited response body
bytes = "1"
url = "2"  # absolute/relative Location resolution + scheme and port checks
# Decoding a proxy URL's percent-encoded userinfo. Already in the tree via `url`.
percent-encoding = "2"
# TLS on `ring`, provider passed explicitly (ADR 0009). The challenge validators
# trust no root store: RFC 8555 §8.3 and RFC 8737 §3 make the certificate the proof.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# ...but the relay is a client of a real CA, so that one path needs roots.
webpki-roots = "1"
# Constant-time comparison, which `ring` no longer offers. Already in the tree via rustls.
subtle = { version = "2", default-features = false }
# Certificate and CSR parsing. Already in the tree via rcgen's `x509-parser` feature.
x509-parser = "0.18"
# The command tree (src/cli/).
clap = { version = "4", features = ["derive"] }
# `completions` and `man`, generated from the derive above. Held at `~4.5`: 4.6's
# bash backend breaks completion for a binary named with a `-`, which
# `the_bash_script_is_internally_consistent` (src/cli/generate.rs) detects.
clap_complete = "~4.5"
clap_mangen = "0.3"
# SMTP for the `email` notifier, on rustls (no native-tls/OpenSSL).
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
# Notification and page templates. `json` is the `tojson` filter a `.j2` webhook
# body needs, auto-escaping being off there (crates/core/src/templating.rs).
minijinja = { version = "2", features = ["json"] }
# PKCS#11 for the `hsm` feature: safe session types, tracked against the OASIS spec.
cryptoki = "0.12"
# The e2e lab's container driver (`tests/e2e/`); a dev-dependency wherever it
# is named.
testcontainers = "0.28"

[package]
name = "acme-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "An ACME (RFC 8555) server that issues from a local CA, relays to an upstream CA, or delegates to a script"
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["acme", "rfc8555", "certificate", "tls", "ca"]
categories = ["cryptography", "network-programming", "web-programming::http-server"]
rust-version.workspace = true
# Kept out of the published `.crate`: material that only means anything inside
# the repository. The library crates under `crates/` are packages of their own.
exclude = [
    "/doc/",
    "/rfc/",
    "/dashboards/",
    "/examples-client/",
    "/tests/e2e/",
    # The harness root that `#[path]`-includes the directory above; left behind
    # it would be a test target referring to files the package does not carry.
    # `cargo package` warns "ignoring test `e2e`" over this — that warning is
    # the exclusion working, not something to fix by putting the file back.
    "/tests/e2e.rs",
    "/.github/",
    "**/CLAUDE.md",
]

[features]
default = []
# PKCS#11 for the `local_ca` signer's issuing key — see `acme-proxy-signer`'s
# own `hsm` feature, which this forwards so `cargo install acme-proxy --features
# hsm` keeps working.
hsm = ["acme-proxy-signer/hsm"]

[dependencies]
acme-proxy-admin.workspace = true
acme-proxy-core.workspace = true
acme-proxy-jobs.workspace = true
acme-proxy-net.workspace = true
acme-proxy-policy.workspace = true
acme-proxy-protocol.workspace = true
acme-proxy-server.workspace = true
acme-proxy-signer.workspace = true
acme-proxy-store.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
acme-proxy-core = { workspace = true, features = ["test-util"] }
acme-proxy-jobs = { workspace = true, features = ["test-util"] }
acme-proxy-net = { workspace = true, features = ["test-util"] }
acme-proxy-signer = { workspace = true, features = ["test-util"] }
acme-proxy-store = { workspace = true, features = ["test-util"] }
async-trait.workspace = true
axum.workspace = true
hex.workspace = true
http-body-util.workspace = true
rcgen.workspace = true
ring.workspace = true
rustls-pki-types.workspace = true
simple_asn1.workspace = true
testcontainers.workspace = true
time.workspace = true
tokio-rustls.workspace = true
# `util` enables `tower::ServiceExt::oneshot`, used to drive the router in tests.
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
x509-parser.workspace = true

[profile.release]
lto = true
codegen-units = 1
strip = true

# The e2e lab's binary (tests/e2e/): release speed without fat LTO, whose relink
# cost minutes per source change. `opt-level` stays 3 because the lab runs
# against real timeouts; `incremental` makes the Containerfile's cache mount pay.
[profile.e2e]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# `ring` optimised in debug and test builds: the operator password KDF
# (`admin::password`, 600 000 PBKDF2 rounds) costs ~1.1 s unoptimised and
# ~0.09 s optimised, and every admin suite pays it at least twice per test.
# Only `ring`, because that loop is compiled entirely inside it. The workspace
# crates stay at opt-level 0. `doc/src/dev/testing.md` has the measurements.
[profile.dev.package.ring]
opt-level = 3
