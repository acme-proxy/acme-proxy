name: CI

on:
  # Branch-filtered so a pull request from a branch in this repository does not
  # trigger two identical runs. `main` is the trunk and `release/X.Y` a patch
  # line cut from `X.Y.0` (doc/src/dev/adr/0013-trunk-and-release-branches.md).
  # Both need push runs of their own: `release.yml` refuses to publish a tag
  # whose commit has no green one on the tag's branch.
  push:
    branches: [main, "release/[0-9]+.[0-9]+"]
  pull_request:
  # A RustSec advisory is published against code that is already merged, so a
  # push/PR-only trigger only ever finds it the next time somebody happens to
  # open a pull request. The `supply-chain` job below runs on this schedule too;
  # `test` skips it, having nothing to say without a change to test.
  schedule:
    - cron: "17 6 * * *"

# Least privilege: nothing in this workflow writes to the repository. The
# `image` job widens only its own grant, to publish.
permissions:
  contents: read

# A newer push to the same ref supersedes the run in progress, except on
# `main`, whose runs end by publishing `edge`: a run cancelled between the
# per-architecture pushes and the index leaves manifests nothing references.
# Pushes to `main` are merges, so queueing them costs little.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

# Every action below is pinned to a commit SHA rather than a tag. A tag is
# mutable: whoever controls the action's repository can repoint it at new code,
# which then runs with this workflow's token and inside the build that produces
# a certificate authority. `taiki-e/install-action` is the sharpest case — it
# downloads and executes prebuilt binaries — but the rule is uniform so no
# reader has to decide which ones matter. The trailing comment is the tag the
# SHA stood for when it was pinned; update both together.
jobs:
  test:
    name: Test, lint & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Nothing here depends on the clock; on the nightly advisory run only
    # `supply-chain` has anything new to say.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes, so the token has no business sitting in
          # `.git/config` where any build script could read it.
          persist-credentials: false

      # Pinned by SHA, so the action can no longer read the toolchain out of its
      # own ref name (`@stable`) and `toolchain:` has to say it explicitly.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          # Pinned for the reason every action here is: these are prebuilt
          # binaries this workflow downloads and runs. Update deliberately.
          tool: cargo-llvm-cov@0.8.7,cargo-nextest@0.9.145

      - name: Format
        run: cargo fmt --all --check

      # `--locked` on every cargo invocation that builds: `Cargo.lock` is
      # committed and `Containerfile` already builds against it, so without this
      # CI was the one place a semver-compatible upstream release could enter a
      # build — including one `cargo deny` (which reads the lockfile) never saw.
      #
      # `--workspace` on every one of them too: at a workspace root that is also
      # a package, a bare `cargo` command acts on that package alone, so without
      # it every crate under `crates/` would drop out of the lint, the tests and
      # the coverage floor without anything going red.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Runs the unit + integration tests under instrumentation. `--no-report`
      # keeps the raw profiles on disk instead of rendering one report and
      # discarding them, so the three `cargo llvm-cov report` invocations below
      # are three views of a single test run rather than three test runs.
      #
      # `nextest` here is not interchangeable with plain `cargo test`: the
      # `custom` script tests in `signer`/`filter`/`notify` exec a file they
      # just wrote, which intermittently fails `ETXTBSY` when tests share one
      # process (see the note on `write_script` in
      # `crates/core/src/testutil.rs`).
      - name: Test with coverage
        run: cargo llvm-cov nextest --locked --workspace --no-report

      # The reports themselves, none of which gates: the gate is the next step,
      # kept separate so a run that lands below the floor still publishes the
      # report saying which file lost the lines. `main.rs` is excluded from
      # every view — it is socket/exit wiring, so counting it would move the
      # metric without anyone being able to act on it — and the regex has to be
      # repeated per invocation, since the filtering happens at report time.
      #
      # **`--no-run --workspace`, not the `report` subcommand.** `report` takes
      # no `--workspace` — the flag belongs to `test`/`nextest`/`--no-run` and
      # is refused there — and with no package selection it reports the package
      # cargo picks, which at a root that is also a package is that package
      # alone. These four views spent their life measuring `src/cli/` while
      # every crate under `crates/` sat outside the floor, which is how
      # `crates/store/src/transfer.rs` reached 30% line coverage without
      # anything going red. `-p` per member is not the fix: a crate built twice
      # under different features then contributes two coverage maps and its
      # lines are counted twice. `--no-run` reuses the profiles the step above
      # left on disk, so this re-runs nothing (~2s).
      #
      # `--no-run` prints a deprecation notice pointing at `report`, which
      # cannot express this scope. `cargo-llvm-cov` is pinned above; whoever
      # lifts the pin owes this a re-check.
      #
      # `lcov.info` is the machine-readable form (any coverage viewer, and the
      # input a service would take if one is ever added); the HTML tree is what
      # a human actually opens from the artifact; the summary goes to the job
      # summary so the per-file table is on the run page itself, without
      # downloading anything or unfolding a log group.
      - name: Coverage reports
        run: |
          cargo llvm-cov --no-run --workspace --lcov --output-path lcov.info \
            --ignore-filename-regex 'src/main\.rs'
          cargo llvm-cov --no-run --workspace --html \
            --ignore-filename-regex 'src/main\.rs'
          {
            echo '## Coverage'
            echo
            echo '```text'
            cargo llvm-cov --no-run --workspace --summary-only \
              --ignore-filename-regex 'src/main\.rs'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The ratchet, set just below the current line coverage (97.1% over the
      # whole workspace). Widening the scope from `src/cli/` to every package
      # first took it to 96.67%, because the copy engine in
      # `crates/store/src/transfer.rs` — which only the `postgres` job
      # exercised — came inside the metric at 30%; the tests it now has are
      # what put the number back.
      #
      # `--fail-under-lines` reads the **Lines** column, not the `Regions` one
      # the summary prints first — they differ by more than a point here, and
      # reading the wrong one makes this look far tighter than it is. A separate
      # step from the rendering above so the failure names itself on the run
      # page: "Coverage floor" red is a sentence, a `report` step red is a
      # question.
      - name: Coverage floor
        run: >
          cargo llvm-cov --no-run --workspace --summary-only
          --ignore-filename-regex 'src/main\.rs'
          --fail-under-lines 97

      # `always()`, because the run where the floor was missed is exactly the
      # run whose report somebody wants to read. Retained for a fortnight
      # rather than the 90-day default: this is a debugging aid tied to one
      # commit, not a record.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            lcov.info
            target/llvm-cov/html
          retention-days: 14
          if-no-files-found: ignore

      # `cargo llvm-cov` does not run doc-tests, so the `rust,no_run` startup
      # example in `src/lib.rs` is otherwise never compiled — and it calls
      # `build_router`, whose signature changes.
      - name: Doc tests
        run: cargo test --locked --workspace --doc

      # `cargo test --doc` compiles the *examples*; it says nothing about the
      # intra-doc links, of which this crate has a great many — the doc comments
      # are where the reasoning lives, and a link pointing at something renamed
      # away rots silently otherwise. It caught three on the run that added it.
      #
      # `private_intra_doc_links` is allowed, and that is a judgement about what
      # this crate is: the library exists so the tests and `main.rs` can reach
      # it, not as a published API, and the doc comments are written for someone
      # reading the source. A public item explaining itself by naming the
      # private thing it delegates to is the good outcome; the alternative is
      # either widening visibility for rustdoc's benefit or unlinking the name,
      # and both are worse than a link a `--document-private-items` build
      # resolves.
      - name: Documentation
        run: cargo doc --locked --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links

  # `Cargo.toml` declares `rust-version`, and until this job existed its own
  # comment admitted CI did not check it: `test` builds on stable, so the floor
  # was a claim rather than a fact. `cargo check` is enough — the point is
  # whether the language and dependency features used still compile there, not
  # whether the tests pass twice.
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes, so the token has no business sitting in
          # `.git/config` where any build script could read it.
          persist-credentials: false

      # Read out of the manifest rather than written here as well: a floor
      # stated in two places is a floor that drifts, and the failure mode is
      # silent — CI would go on proving a version nobody claims.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          test -n "$version" || { echo "Cargo.toml declares no rust-version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features

  # The `hsm` feature is off by default, so the job above neither builds nor
  # lints `crates/signer/src/local_ca/pkcs11.rs` — `--all-targets` does not
  # enable features. It is the signer crate's feature, named as such: the root
  # package's `hsm` only forwards to it, and the PKCS#11 tests live in the
  # signer crate, which only `--workspace` reaches. Without this job the whole PKCS#11 path could rot warning-dirty
  # or stop compiling and nobody would find out.
  #
  # Deliberately separate rather than folded into `test`: that job enforces
  # `--fail-under-lines 97`, and a feature-gated file is not compiled at all
  # with the feature off, so it stays outside the metric entirely. Folding it in
  # would drag the token error-recovery paths — the ones SoftHSM2 cannot easily
  # provoke — inside the ratchet and make the floor fight the feature.
  hsm:
    name: PKCS#11 (SoftHSM2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes, so the token has no business sitting in
          # `.git/config` where any build script could read it.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-nextest@0.9.145

      # Only the module `.so` is needed: the tests create the token and
      # generate the CA key through `cryptoki` itself rather than shelling out
      # to `pkcs11-tool`, so `opensc` is not a prerequisite. Without softhsm2
      # installed the PKCS#11 tests skip rather than fail, which is what keeps
      # them runnable on a developer machine — this job is where they actually
      # execute.
      - name: Install SoftHSM2
        run: sudo apt-get update && sudo apt-get install -y softhsm2

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --features acme-proxy-signer/hsm -- -D warnings

      # `ACME_PROXY_REQUIRE_SOFTHSM` turns `lab_or_skip!` from a skip into a
      # failure. Without it an apt rename, a moved `.so` or a failed install
      # turns every PKCS#11 test green while running none of them — and nothing
      # else would notice, since this file is deliberately outside the coverage
      # floor and so has no number that could collapse.
      - name: Test
        run: cargo nextest run --locked --workspace --features acme-proxy-signer/hsm
        env:
          ACME_PROXY_REQUIRE_SOFTHSM: "1"

  # The book is deployed by `mdbook.yml`, which runs only on a push to `main`,
  # so it documents the trunk, not the last release.
  # Until this job existed, nothing built `doc/` on a pull request — and
  # `create-missing = false` makes a `SUMMARY.md` entry with no file a *build
  # failure*, so the first sign of a broken chapter was a failed deployment
  # after merge. Cheap enough (no Rust toolchain, no cargo build) to run on
  # every change rather than only on ones that touch `doc/`: the README and
  # `config.toml.example` are checked against the book too.
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes, so the token has no business sitting in
          # `.git/config` where any build script could read it.
          persist-credentials: false

      # Pinned, and installed as prebuilt binaries rather than `cargo install`
      # from source: an upstream release should not be able to break the build
      # with no change on this side. Keep these versions in step with
      # `mdbook.yml`, which deploys what this job checks.
      - name: Install mdBook
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: mdbook@0.5.4,mdbook-mermaid@0.17.0

      # `create-missing = false` turns a SUMMARY entry with no file into an
      # error here rather than a stub nobody notices.
      - name: Build the book
        run: mdbook build doc/

      # The mechanical half of the house style: 80-column prose, no numbered
      # headings, tagged code fences, links and anchors that resolve, and no
      # configuration key documented in two files at once. The last one is the
      # rule that actually rots — two copies of a default drift silently.
      - name: Style and link check
        run: python3 doc/lint.py

  supply-chain:
    name: Advisories, licenses & sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes, so the token has no business sitting in
          # `.git/config` where any build script could read it.
          persist-credentials: false

      # `deny.toml` is a hand-tuned policy — curated licence allowlist, ban and
      # source rules — that nothing was enforcing. For a CA, an unnoticed
      # advisory in the crypto or TLS tree is the most expensive kind of miss.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
        with:
          command: check

      # The schedule runs on the default branch alone, but the newest release
      # branch is what a patch release is built from: an advisory against the
      # code operators run should surface the same night, not at the next
      # backport. Older release lines are not scanned; a fix lands on the
      # newest one. A repository with no release branch yet skips this.
      - name: Find the newest release branch
        id: release
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          branch=$(git ls-remote --heads origin \
            | sed -n 's|.*refs/heads/\(release/[0-9]*\.[0-9]*\)$|\1|p' \
            | sort -V | tail -n 1)
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.release.outputs.branch != ''
        with:
          ref: ${{ steps.release.outputs.branch }}
          path: release-branch
          # Nothing here pushes, so the token has no business sitting in
          # `.git/config` where any build script could read it.
          persist-credentials: false

      - name: cargo-deny (${{ steps.release.outputs.branch }})
        if: steps.release.outputs.branch != ''
        uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
        with:
          manifest-path: release-branch/Cargo.toml
          command: check
          command-arguments: --config release-branch/deny.toml

  # `sbom.cdx.json` is a committed CycloneDX 1.5 inventory of the dependency
  # closure that ships in the binary — ASVS 5.0 V15.1.2. `supply-chain` above
  # *gates* that closure; this *publishes* it, so a consumer can answer "is this
  # build affected by RUSTSEC-x" without reconstructing the graph from the
  # source tree. Regenerated here and diffed against the commit: a `Cargo.lock`
  # change that does not also update the SBOM fails the job, the same ratchet
  # shape as the coverage floor.
  #
  # The generator is version-pinned (its version is written into the document),
  # and the output is made reproducible by `SOURCE_DATE_EPOCH` — which also
  # suppresses the otherwise-random `serialNumber` — plus a `jq` pass that drops
  # the wall-clock timestamp and rewrites the one absolute path the tool embeds.
  # The recipe below is duplicated verbatim in `doc/src/dev/contributing.md`;
  # keep the two in step.
  sbom:
    name: SBOM freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes, so the token has no business sitting in
          # `.git/config` where any build script could read it.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Pinned to an exact version, unlike `cargo-nextest` elsewhere in this
      # file: the version string is embedded in `metadata.tools`, so an
      # unpinned bump would land as SBOM drift on an unrelated pull request.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-cyclonedx@0.5.9

      # `cargo metadata --locked` first, so a lockfile that would move is the
      # failure here rather than a silently re-resolved SBOM.
      - name: Regenerate the SBOM
        run: |
          export SOURCE_DATE_EPOCH=0
          cargo metadata --locked --format-version 1 >/dev/null
          cargo cyclonedx --all-features --target all --spec-version 1.5 \
            --format json --override-filename sbom.cdx -q
          jq --arg from "path+file://$PWD" --arg to "path+file:///acme-proxy" \
            'walk(if type == "string" then ((if startswith($from) then $to + .[($from | length):] else . end) | gsub("path\\+file:///acme-proxy#acme-proxy@"; "path+file:///acme-proxy#")) else . end) | del(.metadata.timestamp)' \
            sbom.cdx.json > sbom.cdx.json.tmp
          mv sbom.cdx.json.tmp sbom.cdx.json
          # The tool writes one per workspace member; the committed inventory is
          # the binary's, whose closure already names every member crate.
          rm -f crates/*/sbom.cdx.json

      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- sbom.cdx.json; then
            echo "::error file=sbom.cdx.json::sbom.cdx.json is stale — regenerate it (doc/src/dev/contributing.md) and commit the result"
            exit 1
          fi

  # `tests/e2e/` drives real ACME clients — certbot, acme.sh, lego — against a
  # real `acme-proxy` in containers, and until this job existed CI ran none of
  # it: every test is `#[ignore]`d and nothing passed `--run-ignored`. That is
  # the largest gap in the suite by surface area, and the lab has already caught
  # at least one class of bug the unit tests structurally cannot (hickory
  # reporting an empty NOERROR answer as `Err`, fixed in `crates/net/src/dns.rs`).
  #
  # Nightly rather than per-push: it builds six container images and starts a
  # DNS server plus three client containers per scenario, which is minutes, not
  # seconds.
  #
  # A subset, but no longer only the three challenge types. **A scenario CI does
  # not run rots**, and that is not hypothetical here: `tests/e2e/reload.rs`
  # asserted the *opposite* of the intended behaviour after the signer freeze
  # was lifted and stayed green, because nothing ran it.
  # So the filter now also carries the scenarios that assert behaviour the unit
  # suite structurally cannot reach — SIGHUP against a live process
  # (`reload`), a real upstream ACME CA (`relay_signer`), and the filter chain
  # against real NetBox and phpIPAM containers (`filters`).
  #
  # Still a filter rather than `binary(e2e)` only because the runtime of the
  # remaining scenarios (six `certbot`/`acme_sh` client scenarios, `eab`,
  # `key_change`, `ari`, `profiles`, `custom_signer`, `admin_cli`) has not been
  # measured against this job's budget. Widening it further is the right
  # direction; raise `timeout-minutes` with it.
  e2e:
    name: End-to-end (real ACME clients)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes, so the token has no business sitting in
          # `.git/config` where any build script could read it.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-nextest@0.9.145

      # A filter expression, not a positional argument: nextest's positional
      # filter matches test *names*, and none of these contain "e2e", so
      # `cargo nextest run e2e` silently matches nothing and exits 0.
      - name: Run the challenge scenarios
        run: >
          cargo nextest run --locked
          -E 'binary(e2e) and test(/^(http_01|dns_01|tls_alpn_01|reload|relay_signer|filters)::/)'
          --run-ignored all

  # Publishes `edge` once every job above has passed on a push to `main`, by
  # calling the release workflow, which owns the build, the index and the
  # attestation. Release branches publish nothing here: their images come from
  # the patch tag. The cost is two uncached native builds per merge, which a
  # public repository's runners do not bill.
  #
  # The "same suite, a different backend" job, modelled on `hsm` and separate
  # from `test` for the same reason: the coverage floor is a ratchet over one
  # configuration, and a second one would fight it.
  #
  # `tests/postgres.rs` skips silently when `TEST_POSTGRES_URL` is unset, which
  # is what keeps `cargo nextest run` on a developer machine unaffected. That is
  # also exactly how a service that failed to start would take this job green,
  # so `ACME_PROXY_REQUIRE_POSTGRES` turns every skip into a failure here and
  # `postgres_is_available_when_it_is_required` names the cause directly rather
  # than leaving it to be inferred from a suspiciously fast run.
  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acme
        ports:
          - 5432:5432
        # Without this the job races the container: the first connection
        # arrives before the cluster finishes initialising, and the failure
        # reads as a bug in the backend rather than as a cold start.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes, so the token has no business sitting in
          # `.git/config` where any build script could read it.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-nextest@0.9.145

      # The store's whole suite, plus the dialect-sensitive cases and the two
      # suites that run several processes over one database -- which is the
      # multi-node deployment this backend exists for, and the thing a
      # single-process SQLite run cannot cover.
      #
      # `package(acme-proxy-store)` is the one that matters: every test in that
      # crate calls `Database::connect_for_test()`, so the variable below
      # re-runs all 239 against the server rather than in memory. It is what
      # found `MAX(x, 0)` -- SQLite's scalar two-argument max, which PostgreSQL
      # has only as an aggregate, in a code path no dialect-specific test
      # would have thought to cover.
      - name: Test
        run: |
          cargo nextest run --locked --workspace --no-fail-fast \
            -E 'package(acme-proxy-store) or binary(postgres)
                or binary(roles) or binary(reload)'
        env:
          ACME_PROXY_REQUIRE_POSTGRES: "1"
          TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/acme

  # A called workflow's jobs can only narrow what the caller grants, so this
  # grants everything `release.yml` asks for.
  image:
    name: Publish the edge image
    needs: [test, msrv, hsm, postgres, docs, supply-chain, sbom]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
