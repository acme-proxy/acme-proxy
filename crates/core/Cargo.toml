[package]
name = "acme-proxy-core"
description = "Configuration, ACME wire types and shared vocabulary for acme-proxy (internal crate, no semver promise)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
exclude = ["**/CLAUDE.md"]

[features]
# The shared test scaffolding in `testutil`, for the other crates' unit tests.
# Turned on from `[dev-dependencies]` only, so it never reaches a normal build.
test-util = ["dep:tracing-subscriber"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
config.workspace = true
hex.workspace = true
ipnet.workspace = true
minijinja.workspace = true
ring.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
simple_asn1.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
uuid.workspace = true
x509-parser.workspace = true

[dev-dependencies]
http-body-util.workspace = true
rcgen.workspace = true
tracing-subscriber.workspace = true
