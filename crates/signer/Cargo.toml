[package]
name = "acme-proxy-signer"
description = "The signing backends of acme-proxy: local CA, relay to an upstream ACME server, script (internal crate, no semver promise)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
exclude = ["**/CLAUDE.md"]

[features]
default = []
# The local CA's key behind PKCS#11 (`signer.local_ca.key_source = "pkcs11"`).
# Off by default; the module is `dlopen`ed at runtime and `cryptoki` ships
# pregenerated bindings, so it adds no C toolchain to the build.
hsm = ["dep:cryptoki"]
# `testutil` and the relay's scripted upstream (`relay::testsrv`), for the other
# crates' tests. Turned on from `[dev-dependencies]` only.
test-util = []

# docs.rs documents the `hsm`-gated items, and `--cfg docsrs` turns on
# `doc_cfg` (nightly-only, gated in src/lib.rs) so they say they need the feature.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
acme-proxy-core.workspace = true
acme-proxy-jobs.workspace = true
acme-proxy-net.workspace = true
acme-proxy-store.workspace = true
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
cryptoki = { workspace = true, optional = true }
hex.workspace = true
hickory-proto.workspace = true
http-body-util.workspace = true
hyper.workspace = true
rcgen.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
simple_asn1.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
x509-parser.workspace = true

[dev-dependencies]
acme-proxy-core = { workspace = true, features = ["test-util"] }
acme-proxy-jobs = { workspace = true, features = ["test-util"] }
acme-proxy-net = { workspace = true, features = ["test-util"] }
acme-proxy-store = { workspace = true, features = ["test-util"] }
axum.workspace = true
bytes.workspace = true
uuid.workspace = true
